project:
  type: website
  output-dir: _site
  resources:
    - "static/**"
  render:
    - "*.qmd"
    - "content/**/*.qmd"
    - "!PRODUCT.md"
    - "!DESIGN.md"
    - "!CLAUDE.md"
    - "!static/**"

website:
  title: "The Ocean Code"
  description: "Robert William Schlegel — marine heatwaves, climate change, biodiversity, and data science."
  site-url: "https://theoceancode.netlify.app"
  google-analytics: "G-P6C1DFHPRD"
  search:
    location: navbar
    type: overlay
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: publication.qmd
        text: Publications
      - href: package.qmd
        text: Packages
      - href: project.qmd
        text: Projects
      - href: poster.qmd
        text: Posters
      - href: talk.qmd
        text: Talks
      - href: blog.qmd
        text: Blog
      - href: contact.qmd
        text: Contact
    right:
      - text: Email
        href: mailto:robwschlegel@gmail.com
        target: _blank
      - text: Scholar
        href: https://scholar.google.co.za/citations?user=cPHukk8AAAAJ&hl=en
        target: _blank
      - text: GitHub
        href: https://github.com/robwschlegel
        target: _blank
      - text: CV
        href: /static/files/cv.pdf
        target: _blank
  page-footer:
    center: "&copy; 2026 Robert William Schlegel"

format:
  html:
    theme: [cosmo, styles.scss]
    toc: false
    page-layout: article

execute:
  freeze: auto
